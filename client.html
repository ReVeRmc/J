<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J AI Assistant - Клиент</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e8edf5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(74, 158, 255, 0.2);
        }

        .header h1 {
            font-size: 24px;
            color: #4a9eff;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: #6b7a94;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: rgba(74, 158, 255, 0.15);
            border: 1px solid rgba(74, 158, 255, 0.3);
        }

        .message.assistant {
            align-self: flex-start;
            background: rgba(74, 158, 255, 0.05);
            border: 1px solid rgba(74, 158, 255, 0.1);
        }

        .message .role {
            font-size: 10px;
            color: #6b7a94;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .message .content {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .input-container {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(74, 158, 255, 0.2);
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(74, 158, 255, 0.2);
            border-radius: 8px;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .input-container input:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.1);
        }

        .voice-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(74, 158, 255, 0.3);
            background: rgba(74, 158, 255, 0.1);
            color: #4a9eff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-button:hover {
            background: rgba(74, 158, 255, 0.2);
            transform: scale(1.05);
        }

        .voice-button.listening {
            background: rgba(74, 158, 255, 0.3);
            border-color: #4a9eff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(74, 158, 255, 0.5);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(74, 158, 255, 0);
            }
        }

        .status {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #6b7a94;
        }

        .status.connected {
            color: #4ade80;
        }

        .status.error {
            color: #ef4444;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(74, 158, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(74, 158, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 J AI Assistant</h1>
        <p id="status" class="status">Подключение к серверу...</p>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <div class="role">J</div>
            <div class="content">Здравствуйте! Я J — ваш AI-ассистент. Задайте мне любой вопрос!</div>
        </div>
    </div>

    <div class="input-container">
        <input 
            type="text" 
            id="messageInput" 
            placeholder="Введите сообщение..."
            autocomplete="off"
        >
        <button class="voice-button" id="voiceButton" title="Голосовой ввод">
            🎤
        </button>
    </div>

    <script>
        const SERVER_URL = 'http://localhost:8080';
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const voiceButton = document.getElementById('voiceButton');
        const statusElement = document.getElementById('status');

        let recognition = null;
        let isListening = false;

        // Инициализация распознавания речи
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                messageInput.value = transcript;
                sendMessage();
            };

            recognition.onend = () => {
                isListening = false;
                voiceButton.classList.remove('listening');
                voiceButton.textContent = '🎤';
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                isListening = false;
                voiceButton.classList.remove('listening');
                voiceButton.textContent = '🎤';
                addMessage('assistant', '❌ Ошибка распознавания речи. Попробуйте ещё раз.');
            };
        } else {
            voiceButton.style.display = 'none';
        }

        // Обработчик кнопки голоса
        voiceButton.addEventListener('click', () => {
            if (!recognition) {
                addMessage('assistant', '❌ Распознавание речи не поддерживается в вашем браузере.');
                return;
            }

            if (isListening) {
                recognition.stop();
                isListening = false;
                voiceButton.classList.remove('listening');
                voiceButton.textContent = '🎤';
            } else {
                recognition.start();
                isListening = true;
                voiceButton.classList.add('listening');
                voiceButton.textContent = '⏹';
            }
        });

        // Обработчик отправки сообщения
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Добавляем сообщение пользователя
            addMessage('user', message);
            messageInput.value = '';

            // Показываем индикатор загрузки
            const loadingId = addMessage('assistant', '⏳ Думаю...', true);

            try {
                // Отправляем запрос на сервер
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Удаляем индикатор загрузки
                removeMessage(loadingId);

                if (data.success) {
                    addMessage('assistant', data.response);
                    updateStatus('connected', '✅ Подключено к серверу');
                } else {
                    addMessage('assistant', `❌ Ошибка: ${data.error}`);
                }

            } catch (error) {
                removeMessage(loadingId);
                addMessage('assistant', `❌ Ошибка подключения к серверу: ${error.message}`);
                updateStatus('error', '❌ Ошибка подключения');
            }
        }

        function addMessage(role, content, isLoading = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const id = Date.now() + Math.random();
            messageDiv.dataset.id = id;

            const roleDiv = document.createElement('div');
            roleDiv.className = 'role';
            roleDiv.textContent = role === 'user' ? 'Вы' : 'J';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            contentDiv.textContent = content;

            messageDiv.appendChild(roleDiv);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);

            // Прокрутка к последнему сообщению
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return id;
        }

        function removeMessage(id) {
            const message = chatContainer.querySelector(`[data-id="${id}"]`);
            if (message) {
                message.remove();
            }
        }

        function updateStatus(type, text) {
            statusElement.className = `status ${type}`;
            statusElement.textContent = text;
        }

        // Проверка подключения к серверу
        async function checkConnection() {
            try {
                // Простой GET-запрос без preflight — сервер отдаёт client.html,
                // если он запущен (для file:// origin POST мог блокироваться CORS)
                const response = await fetch(SERVER_URL + '/?t=' + Date.now(), { method: 'GET' });
                
                if (response.ok) {
                    updateStatus('connected', '✅ Подключено к серверу');
                } else {
                    updateStatus('error', '❌ Сервер недоступен');
                }
            } catch (error) {
                updateStatus('error', '❌ Сервер недоступен');
            }
        }

        // Проверяем подключение при загрузке и периодически после этого
        checkConnection();
        setInterval(checkConnection, 5000);
    </script>
</body>
</html>
